name: ci-checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"


jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Go format
        shell: bash
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
          echo "The following files are not formatted:"
          echo "$files"
          exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
           go-version-input: 1.24.0
           
      - name: Go build
        run: go build ./...
