name: ci-checks

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2019, macos-13]
    # Conditional execution based on OS and events
    if: |
      matrix.os == 'ubuntu-latest' ||
      (matrix.os == 'windows-2019' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (matrix.os == 'macos-13' && startsWith(github.ref, 'refs/tags/v'))

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Go format
        shell: bash
        run: |
          files=$(gofmt -s -l .)
          if [ -n "$files" ]; then
            echo "The following files are not formatted:"
            echo "$files"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Vulnerability check
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.24.11

      - name: Go build
        run: go build ./...
