name: Go Lint (new issues only)

on:
  pull_request:
    paths:
      - "**/*.go"

jobs:
  golangci-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run golangci-lint (diff-only)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: >
            --new-from-rev=origin/${{ github.base_ref }}
            --timeout=5m
