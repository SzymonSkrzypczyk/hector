name: Go Lint

on:
  pull_request:
    paths:
      - "**/*.go"
  push:
    paths:
      - "**/*.go"

jobs:
  golangci-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # PR: only new issues
      - name: Lint (PR – new issues only)
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: >
            --new-from-rev=origin/${{ github.base_ref }}
            --timeout=5m

      # Push: full lint
      - name: Lint (push – full)
        if: github.event_name == 'push'
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: >
            --timeout=5m
