version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ .ProjectName }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - repository:
      owner: SzymonSkrzypczyk
      name: homebrew-hector
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"

    url_template: "https://github.com/SzymonSkrzypczyk/hector/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

    commit_author:
      name: Szymon Skrzypczyk
      email: szymon.skrzypczyk@vp.pl

    homepage: "https://github.com/SzymonSkrzypczyk/hector"
    description: "Hector is a static CV generator that allows users to create professional CVs using predefined themes and structured data files."
    license: "MIT"

release:
  github:
    owner: SzymonSkrzypczyk
    name: hector
  draft: false
  prerelease: auto
